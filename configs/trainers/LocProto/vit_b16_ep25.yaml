DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 2

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]
  RRCROP_SCALE: (0.5, 1.0)

OPTIM:
  NAME: "adamw"
  LR: 3e-5              #cho attn_layer - layer cuối image encoder
  WEIGHT_DECAY: 0.01
  MAX_EPOCH: 200
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 4
  WARMUP_TYPE: "linear"
  WARMUP_MIN_LR: 1e-6

TRAIN:
  PRINT_FREQ: 16

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
